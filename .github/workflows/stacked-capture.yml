name: Stacked Capture Regression

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story pack to run"
        type: choice
        options:
          - all
          - candyland
          - toyworld
          - gamingstudio5000
        default: all
      live:
        description: "Attempt live stacked hook (still skips sequential live apply in this slice)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stacked:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deterministic stacked mutation path
        id: stacked_verify
        run: npm run verify:stacked-capture
        env:
          STACKED_STORY: ${{ github.event.inputs.story }}
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Stacked Playwright journeys
        id: stacked_e2e
        run: npm run test:stacked-capture
        env:
          STACKED_STORY: ${{ github.event.inputs.story }}
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
          CI: "true"
      - name: Optional live stacked hook
        if: ${{ github.event.inputs.live == 'true' }}
        run: npm run eval:stacked-capture
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true
      - name: Record stacked outcomes
        if: always()
        run: |
          mkdir -p test-results
          record() {
            local name="$1"
            local outcome="$2"
            if [ "$outcome" = "success" ]; then echo pass > "test-results/${name}.outcome"
            elif [ "$outcome" = "skipped" ]; then echo skip > "test-results/${name}.outcome"
            else echo fail > "test-results/${name}.outcome"
            fi
          }
          record stacked-capture "${{ steps.stacked_verify.outcome }}"
          record playwright "${{ steps.stacked_e2e.outcome }}"
      - name: Job summary
        if: always()
        continue-on-error: true
        run: npx --yes tsx scripts/test-dashboard/publish.ts --mode summary --results-dir test-results
      - name: Upload stacked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stacked-capture-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  dashboard:
    name: Lume Test Dashboard
    needs: [stacked]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download stacked evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stacked-capture-evidence
          path: stacked-upload
      - name: Merge evidence
        if: always()
        run: |
          mkdir -p test-results
          if [ -d stacked-upload/test-results ]; then
            cp -r stacked-upload/test-results/. test-results/
          else
            cp -r stacked-upload/. test-results/ || true
          fi
      - name: Publish dashboard
        if: always()
        run: npx --yes tsx scripts/test-dashboard/publish.ts --mode both --results-dir test-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
